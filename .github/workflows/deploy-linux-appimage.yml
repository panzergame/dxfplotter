on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    branches:
      - 'release/v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ubuntu
      options: --cap-add SYS_ADMIN --device /dev/fuse --security-opt apparmor:unconfined
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0
      - name: Build and test
        run: ci/buildappimage.sh
        env:
          LD_LIBRARY_PATH: /opt/lib
      - name: Compute tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME##*/}" >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "dxfplotter*.AppImage"
          tag_name: ${{ steps.tag.outputs.name }}
          # Without this, a missing tag is created on the default branch instead of the built commit
          target_commitish: ${{ github.sha }}
